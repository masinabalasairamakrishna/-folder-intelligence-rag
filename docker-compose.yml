version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: folder_rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://raguser:ragpassword@mysql_db:3306/folder_rag
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-1.5-flash
    volumes:
      - ./storage:/app/storage
    depends_on:
      - mysql_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: folder_rag_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  mysql_db:
    image: mysql:8.0
    container_name: folder_rag_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: folder_rag
      MYSQL_USER: raguser
      MYSQL_PASSWORD: ragpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
